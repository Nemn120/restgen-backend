classes:
  - name: "ExpedienteClave"
    entity:
      tableName: "EXPEDIENTE_CLAVE"
      extendsClass: "ABSTRACT_ID_AUDITABLE_ENTITY"
      options:
        inheritanceStrategy: "SINGLE_TABLE"
        uniqueConstraints:
          - "CODIGO"
          - "TIPO"
        discriminator:
          column:
            name: "TIPO"
            type: "STRING"
            length: 80
          options:
            force: true
            insert: false
        sequence:
          create: true
          name: "CLAVE_SEQUENCE"
          increment: 2
        isAudited: true
      columns:
        - property:
            name: "expediente"
            type: "Expediente"
            visibility: "PROTECTED"
          column:
            name: "ID_EXPEDIENTE"
            length: "80"
            precision: 12
            scale: 2
            unique: true
            foreignkey: true
            nullable: false
          relation:
            type: "MANY_TO_ONE"
            fetch: "LAZY"
            joinColumnReferenced: "ID"
            notAudited: true
        - property:
            name: "clave"
            type: "Clave"
            visibility: "PROTECTED"
          column:
            name: null
            length: null
            precision: null
            scale: null
            unique: null
            foreignkey: true
            nullable: true
          relation:
            type: "ONE_TO_ONE"
            fetch: "LAZY"
            joinColumnReferenced: "ID"
        - property:
            name: "descripcion"
            type: "STRING"
            visibility: "PUBLIC"
          column:
            name: "DESCRIPCION"
            length: 150
            precision: null
            scale: null
            unique: true
            foreignkey: false
            nullable: true
          relation:
            type: null
            fetch: null
            joinColumnReferenced: null
  - name: "Clave"
    entityClass:
      tableName: "CLAVE"
      extendsClass: "ABSTRACT_ID_AUDITABLE_ENTITY"
      options:
        extendsIdAuditable: true
        uniqueConstraints:
          - "CODIGO"
          - "TIPO"
        discriminator:
          column:
            name: "TIPO"
            type: "STRING"
            length: 50
          options:
            force: true
            insert: false
        sequence:
          create: true
          name: "CLAVE_SEQUENCE"
          increment: 2
        isAudited: true
      columns:
        - property:
            name: "codigo"
            type: "STRING"
            visibility: "PUBLIC"
            isRelationNotAudited: true
          column:
            name: "CODIGO"
            length: 5
            nullable: false
        - property:
            name: "nombre"
            type: "STRING"
            visibility: "PUBLIC"
          column:
            name: "NOMBRE"
            length: 50
            nullable: false
        - property:
            name: "fechaBaja"
            type: "DATE"
            visibility: "PUBLIC"
          column:
            name: "FECHA_BAJA"
            nullable: true
  - name: "ClaveEdificacion"
    entityClass:
      tableName: "CLAVE_EDIFICACION"
      extendsClass: "Clave"
      options:
        extendsIdAuditable: true
        uniqueConstraints:
          - "CODIGO"
          - "TIPO"
        sequence:
          create: true
        isAudited: true
        columns:
          - property:
              name: "tipoConstruccion"
              type: "STRING"
              visibility: "PUBLIC"
            column:
              name: "TIPO_CONSTRUCCION"
              length: 150
              nullable: true